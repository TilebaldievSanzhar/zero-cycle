# Обязательные разделы проектной документации по ПП РФ № 87 (ред. 21.10.2025;
# текст — bim-data/norms/ru/PP_87_sostav_razdelov_PD_consultant.txt):
# - п. 3(1) — для строительства объектов производственного и непроизводственного назначения;
# - п. 3(2) — для строительства линейных объектов;
# - п. 3(3) — при реконструкции и капитальном ремонте состав определяет заказчик в задании на проектирование;
# - п. 3(4) — смета обязательна при финансировании с привлечением бюджетных средств.
# Наименования и шифры разделов — в sections.toml. Раздел «Иная документация в случаях, предусмотренных
# законодательными и иными нормативными правовыми актами» (13 и 10) не судим: когда он нужен, пакет не говорит.
# condition — когда раздел обязателен; без condition — обязателен всегда.

[[nonlinear]]
number = 1
basis = "п. 3(1) а"

[[nonlinear]]
number = 2
basis = "п. 3(1) б"

[[nonlinear]]
number = 3
basis = "п. 3(1) в"

[[nonlinear]]
number = 4
basis = "п. 3(1) г"

[[nonlinear]]
number = 5
basis = "п. 3(1) д"
# подразделы — п. 15; газоснабжение — только если оно предусмотрено, остальные системы — почти у любого здания
subsections = [1, 2, 3, 4, 5]
subsections_basis = "п. 15"

[[nonlinear]]
number = 6
basis = "п. 3(1) е"
condition = "для объекта непроизводственного назначения — если его разработку требует задание на проектирование"

[[nonlinear]]
number = 7
basis = "п. 3(1) ж"

[[nonlinear]]
number = 8
basis = "п. 3(1) з"

[[nonlinear]]
number = 9
basis = "п. 3(1) и"

[[nonlinear]]
number = 10
basis = "п. 3(1) к"

[[nonlinear]]
number = 11
basis = "п. 3(1) л"

[[nonlinear]]
number = 12
basis = "п. 3(1) м, п. 3(4)"
condition = "при финансировании с привлечением бюджетных средств или средств юрлиц по ч. 2 ст. 8.3 ГрК РФ"

[[linear]]
number = 1
basis = "п. 3(2) а"

[[linear]]
number = 2
basis = "п. 3(2) б"
condition = "если для строительства нужна документация по планировке территории"

[[linear]]
number = 3
basis = "п. 3(2) в"

[[linear]]
number = 4
basis = "п. 3(2) г"

[[linear]]
number = 5
basis = "п. 3(2) д"

[[linear]]
number = 6
basis = "п. 3(2) е"

[[linear]]
number = 7
basis = "п. 3(2) ж"

[[linear]]
number = 8
basis = "п. 3(2) з"

[[linear]]
number = 9
basis = "п. 3(2) и, п. 3(4)"
condition = "при финансировании с привлечением бюджетных средств или средств юрлиц по ч. 2 ст. 8.3 ГрК РФ"
