# Разделы проектной документации по ПП 87 (ред. 21.10.2025) и шифры для разбора обозначений.
# Шифры — практика организаций и рекомендуемое прил. Б ГОСТ Р 21.101-2020: раздел определяем по номеру
# и наименованию, а шифр проверяем на согласованность внутри пакета (docs/adr/0003-jurisdiction-packs.md).
# Обязательность разделов по виду объекта и источнику финансирования — в правилах комплектности (шаг 0.7).

