# Редакция СПДС: ГОСТ Р 21.101-2020, прил. Ж и И — основные надписи; прил. Г — марки рабочих чертежей.
# Ячейка = [x0, x1, y0, y1] в мм от левого верхнего угла основной надписи (x вправо, y вниз).
# Основная надпись стоит в правом нижнем углу внутренней рамки.
# Левая часть (65 мм): таблица изменений над шапкой «Изм. | Кол.уч | Лист | № док. | Подп. | Дата»,
# под шапкой — строки подписей. Строки — по 5 мм. Графа 27 (заказчик) — строка 10 мм над формами 3–5,
# по необходимости; графа 26 (формат) — под основной надписью, в поле нижней рамки.

standard = "ГОСТ Р 21.101-2020"
verified = true  # формы сверены с рисунками прил. Ж (PLAN, шаг 0.3)
width = 185  # ширина всех форм, мм

[frame]  # поля внутренней рамки, мм (прил. И)
left = 20
top = 5
right = 5
bottom = 5

[columns.changes]  # графы 14–19
14 = [0, 10]
15 = [10, 20]
16 = [20, 30]
17 = [30, 40]
18 = [40, 55]
19 = [55, 65]

[columns.signatures]  # графы 10–13
10 = [0, 20]
11 = [20, 40]
12 = [40, 55]
13 = [55, 65]

[header]  # подписи граф шапки, как их пишет стандарт: по ним основная надпись находится и без линий
labels = ["Изм.", "Кол.уч", "Лист", "№ док.", "Подп.", "Дата"]

# Как подписи шапки пишут в реальных штампах: образцы fnmatch («*» — любые знаки) по подписи без пробелов
# и точек, в нижнем регистре. Варианты из реальных ПСД — tests/test_titleblock_variants.py.
[header.roles]
14 = ["изм*"]
15 = ["кол*", "код*"]  # «Код» вместо «Кол.уч»
16 = ["лист"]
17 = ["*док*"]  # «№ док.», «Nдок», «№ докум.» (ЕСКД)
18 = ["подп*"]  # «Подп.», «Подпись»
19 = ["дат*"]

[label_graphs]  # подписи правой части → графа со значением под подписью
"Стадия" = 6
"Лист" = 7
"Листов" = 8
"Масса" = 24
"Масштаб" = 25

[format]  # подпись графы 26; в шрифтах САПР «т» бывает латинской «m»
labels = ["Формат", "Формаm"]

