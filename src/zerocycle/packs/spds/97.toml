# Редакция СПДС: ГОСТ 21.101-97 «Основные требования к проектной и рабочей документации». На неё ссылаются
# эксперты РК: в 14 заключениях из 49, на ГОСТ Р 21.101-2020 — ни в одном (docs/bench/REMARKS_KZ.md).
#
# Сверено 28.10.2026 по двум копиям текста — meganorm.ru (с рисунками форм) и dnaop.com; копии и рисунки форм
# лежат в bim-data/norms/kz/. Здесь — только отличия от редакции 2020: таблицы сливаются с родительскими по
# ключам, списки и значения заменяются, false убирает унаследованное (packs.merge).
#
# Совпадает с 2020 (прил. Д и Е): формы 3–6 — высоты, строки изменений и подписей, колонки 10/10/10/10/15/10,
# ячейки граф 1–9 и 23–25; подписи шапки и правой части; поля рамки 20/5/5/5 мм. Графы 20–22 и «Согласовано»
# на поле для подшивки опись не читает.

extends = "2020"
standard = "ГОСТ 21.101-97"
verified = true

[typical_frame]  # прил. Е: размеры в скобках — рамка типовой проектной документации: сверху 10, снизу 15 мм
top = 10
bottom = 15

# Графа 26 — «Копировал»: подпись лица, копировавшего чертёж (прил. Д). Формат листа графой не нумеруется,
# но шаблоны САПР пишут его рядом — опись читает его как запись формата, без номера графы.
[format]
graph = false

[copier]
labels = ["Копировал"]
graph = 26

# Графы 27 (заказчик) в этой редакции нет.
[forms.3.graphs]
27 = false

[forms.4.graphs]
27 = false

[forms.5.graphs]
27 = false

[stages]  # графа 6 (прил. Д): только П и Р
"П" = "проектная документация, в том числе утверждаемая часть рабочего проекта"
"И" = false

[designation]  # п. 9.4: содержание — обозначение документа и «С»: 2345-ГТ.С, 2345-11-КЖ.ИС; п. 9.6: 2345-СП
contents = ".С"

[volume]  # п. 4.1.4: в каждом томе не более 250 листов А4, 150 — А3, 75 — А2, 50 — А1
max_sheets = { A4 = 250, A3 = 150, A2 = 75, A1 = 50 }

# Марки основных комплектов рабочих чертежей: прил. А, таблица А.1. По примечанию к таблице можно назначать
# дополнительные марки — до трёх прописных букв; «Автоматизация …» — «А» и марка комплекта (АОВ, АВК …).
[marks]
"ГТ" = "Генеральный план и сооружения транспорта"
"ВК" = "Водопровод и канализация"
"ОВ" = "Отопление, вентиляция и кондиционирование воздуха"
"ТМ" = "Тепломеханические решения котельных"
"СС" = "Системы связи"
"ГГ" = false  # в 2020 — вместо ГТ
"КМ" = false  # строки «Конструкции металлические — КМ» нет ни в одной из двух копий; КМД есть
"КДД" = false
"ЭОМ" = false
"ЭВ" = false
"ЭК" = false
