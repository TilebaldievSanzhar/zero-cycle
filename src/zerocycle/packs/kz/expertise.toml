# Знание экспертизы РК (движок v2, PROTOCOL_V3): документы, которые эксперты заставляли добавить по замечаниям.
#
# Вид документа:
#   added  — как его называет разметка пунктов заключений (поле «представлен документ», разметка Codex): по этим
#            выражениям сборщик знания (remarks/knowledge.py) считает, в скольких заключениях его требовали;
#   names  — признаки документа в имени файла или папки пакета;
#   heads  — признаки в заголовке страницы (первые строки; у расчётов и паспортов — и на листах с основной надписью);
#   body   — заголовок прописными в любом месте листа («СВОДНЫЙ СМЕТНЫЙ РАСЧЕТ» внутри тома смет), с учётом регистра:
#            упоминание в тексте записки строчными так не засчитывается; листы-перечни («Состав проекта») не в счёт;
#   ird    — вид проверяет правило kz.completeness.ird по Правилам КВЭ: правило знания его не дублирует, но частота
#            из практики идёт агенту через MCP;
#   basis  — пункт открытой нормы, если он есть (Приказ № 299); иначе основание — практика экспертизы;
#   objects / works — где вид применим: building, linear, landscape / new, reconstruction, capital_repair (пусто — везде).
# Выражения — регулярные, без учёта регистра, над текстом с «ё» → «е»; строки в одинарных кавычках — без экранирования.
# Порядок важен: первое совпадение по «added» решает вид пункта.
#
# Источники: разметка 12 085 пунктов 495 заключений РК (docs/bench/LABELING.md), без заключений отложенной части V3
# (docs/bench/data/v3_split.json, knowledge_exclude).

