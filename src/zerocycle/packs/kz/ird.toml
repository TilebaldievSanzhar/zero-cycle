# Исходно-разрешительные и сопроводительные документы, которые подаются на комплексную вневедомственную экспертизу
# вместе с ПСД (Правила КВЭ, Приказ № 299): приложение 2 — новое строительство, 3 — реконструкция, 4 — капремонт.
# Тексты приложений: bim-data/norms/kz/gosexpertiza_prilozhenie_*_299.docx (с изменениями по 2023 год).
#
# Пункт:
#   basis      — по виду работ: new / reconstruction / capital_repair → пункт приложения;
#   names      — признаки документа в имени файла;
#   heads      — признаки в начале страницы (заголовок документа, а не упоминание в тексте ПЗ);
#   weak       — похожие документы: найдены только они — «проверить вручную»;
#   condition  — пункт обязателен не всегда: не найден — «проверить вручную» с этим условием.
# Выражения — регулярные, без учёта регистра, над текстом с «ё» → «е»; строки в одинарных кавычках — без экранирования.
#
# Не проверяются: копии документов заказчика и банковские реквизиты (подаются с заявкой на портале, в состав ПСД
# не входят); материалы проекта по п. 15 Правил (состав ПСД по СН РК 1.02-03-2022 — текста норматива нет).

source = "Правила КВЭ (Приказ № 299)"
evidence = "REMARKS_KZ: исходно-разрешительная документация и согласования — в 27 заключениях из 49; документы сметы — в 20"

[[item]]
id = "investment-decision"
title = "Решение заказчика об инвестировании проекта"
basis = { new = "прил. 2, п. 1, подп. 1)", reconstruction = "прил. 3, п. 1, подп. 1)", capital_repair = "прил. 4, п. 1, подп. 1)" }
names = ['решени\w*\s+(?:заказчика\s+)?об\s+инвестир', 'инвестиц\w*\s+решени']
heads = ['решени\w*\s+(?:заказчика\s+)?об\s+инвестировани', 'об\s+инвестировании\s+проекта']
weak = ['бюджетн\w*\s+программ', 'бюджетн\w*\s+заявк', 'инвестиционн\w*\s+предложени']

[[item]]
id = "land-title"
title = "Правоустанавливающий документ на земельный участок"
basis = { new = "прил. 2, п. 1, подп. 2)" }
names = ['гос\.?\s*акт', 'акт\w*\s+на\s+(?:право|земельн|зем\.)', 'правоустан', 'договор\w*\s+аренды\s+земел']
heads = [
    'акт\w*\s+на\s+право\s+(?:частной\s+собственности|временного|постоянного|землепольз)',
    'государственн\w+\s+акт\w*\s+на',
    'договор\w*\s+(?:временного\s+)?(?:возмездного\s+)?(?:аренды|землепользования)\s+земельн',
    '(?:постановлени|решени)\w*\s+(?:местного\s+исполнительного\s+органа|акима\w*)[^.]{0,120}(?:предоставлени|право)\w*[^.]{0,60}земельн',
]
weak = ['акт\w*\s+выбора', 'договор\w*\s+аренды', 'кадастров', 'зем\w*\.?\s*проект', 'землеустро']

[[item]]
id = "surveys-geology"
title = "Материалы инженерно-геологических изысканий"
basis = { new = "прил. 2, п. 1, подп. 3)" }
names = ['геолог', '\bиги\b', 'инж\w*[\s.-]*геол']
# «Инженерно-геологические условия площадки» — раздел записки или общих данных, а не отчёт изысканий
heads = ['инженерно[\s-]*геологическ\w*\s+изыскани', 'отчет\w*\s+(?:об\s+|по\s+|о\s+)?(?:инженерно[\s-]*)?геолог', 'технический\s+отчет[^.]{0,80}геолог']

[[item]]
id = "surveys-topo"
title = "Материалы инженерно-геодезических изысканий (топографическая съёмка)"
basis = { new = "прил. 2, п. 1, подп. 3)" }
names = ['геодез', 'топо', '\bигди\b', 'топосъем']
# «План на топосъёмке М 1:500» в общих данных генплана — упоминание: «топографическую съёмку» не ищем в заголовках
heads = ['инженерно[\s-]*геодезическ\w*\s+изыскани', 'отчет\w*\s+(?:об\s+|по\s+|о\s+)?(?:инженерно[\s-]*)?(?:геодез|топограф)', 'технический\s+отчет[^.]{0,80}(?:геодез|топограф)']

[[item]]
id = "tech-conditions"
title = "Технические условия на подключение к источникам инженерного и транспортного обеспечения"
basis = { new = "прил. 2, п. 1, подп. 4)", reconstruction = "прил. 3, п. 1, подп. 5)" }
names = ['\bту\b', 'тех\w*\.?\s*услови', 'технические\s+условия']
heads = ['технические\s+условия', '\bту\s*№']

[[item]]
id = "apz"
title = "Архитектурно-планировочное задание (АПЗ)"
basis = { new = "прил. 2, п. 1, подп. 5)", reconstruction = "прил. 3, п. 1, подп. 6)" }
names = ['\bапз\b', 'архитектурно[\s-]*планировочн']
heads = ['архитектурно[\s-]*планировочн\w*\s+задани', '\bапз\b']
condition_for = { reconstruction = "при реконструкции АПЗ нужно, если меняется внешний облик (фасады) или планировка территории" }

[[item]]
id = "design-assignment"
title = "Утверждённое заказчиком задание на проектирование"
basis = { new = "прил. 2, п. 1, подп. 6)", reconstruction = "прил. 3, п. 1, подп. 7)", capital_repair = "прил. 4, п. 1, подп. 3)" }
names = ['задани\w*\s+на\s+(?:проектир|разработку)', '\bзнп\b']
heads = ['задани\w*\s+на\s+(?:проектирование|разработку\s+(?:рабочего\s+)?проект)', 'задание\s+на\s+проектирование']
weak = ['медико[\s-]*технологическ\w*\s+задани', 'медико[\s-]*техническ\w*\s+задани', '\bмтз\b', 'техническ\w*\s+задани']

[[item]]
id = "survey-acts"
title = "Акты технического обследования существующих зданий и сооружений, заключение по обследованию"
basis = { reconstruction = "прил. 3, п. 1, подп. 2)" }
names = ['обследовани', 'тех\.?\s*обслед']
heads = ['техническ\w*\s+обследовани', 'заключени\w*\s+по\s+результатам\s+(?:технического\s+)?обследовани', 'акт\w*\s+(?:технического\s+)?обследовани']

[[item]]
id = "defect-acts"
title = "Дефектные акты по результатам технического обследования"
basis = { reconstruction = "прил. 3, п. 1, подп. 3)", capital_repair = "прил. 4, п. 1, подп. 2)" }
names = ['дефект', 'деф\.\s*вед']
heads = ['дефектн\w*\s+(?:акт|ведомост)']

[[item]]
id = "other-approvals"
title = "Иные согласования проекта, предусмотренные законодательством"
basis = { new = "прил. 2, п. 1, подп. 8)" }
names = ['согласовани', 'согласован']
# «Лист согласования» — визы смежных разделов внутри проекта, не внешнее согласование
heads = ['\bсогласовани\w*\s+(?:эскизного|проекта\s+с|с\s+(?:местн|отдел|управлени|акимат))']
condition = "нужны ли согласования (эскизный проект, сети, санитарные) — по назначению объекта"

[[item]]
id = "designer-license"
title = "Лицензия разработчика проекта на проектную деятельность"
basis = { new = "прил. 2, п. 5, подп. 3)", reconstruction = "прил. 3, п. 3, подп. 3)", capital_repair = "прил. 4, п. 3, подп. 3)" }
# лицензия изыскателя («Лицензия изыс.pdf») — не лицензия разработчика проекта
names = ['лиценз(?!\w*\.?\s*изыс)']
# номер лицензии на титульном листе («ГСЛ № …») — ссылка, а не копия лицензии: ищем только файл
weak = ['лицензи\w*[^.]{0,120}изыскат', 'лиценз\w*\.?\s*изыс']
condition = "лицензия могла быть подана отдельно, с заявкой на портале"

[[item]]
id = "design-cost"
title = "Расчёт стоимости проектных (проектно-изыскательских) работ"
basis = { new = "прил. 2, п. 5, подп. 4)", reconstruction = "прил. 3, п. 3, подп. 4)", capital_repair = "прил. 4, п. 3, подп. 4)" }
names = ['стоимост\w*\s+(?:проектн|пир)', '\bпир\b']
heads = ['расчет\w*\s+стоимости\s+(?:проектн|проектно[\s-]*изыскательск)', 'стоимост\w*\s+проектно[\s-]*изыскательск']
condition = "расчёт может входить в сметную документацию одним из листов"

[[item]]
id = "price-list"
title = "Утверждённый заказчиком перечень материалов и оборудования по прайс-листам"
basis = { new = "прил. 2, п. 5, подп. 6)", reconstruction = "прил. 3, п. 3, подп. 6)", capital_repair = "прил. 4, п. 3, подп. 6)" }
names = ['прайс', 'прейскурант', 'перечень\s+цен']
heads = ['перечень\s+(?:цен|материалов)[^.]{0,160}(?:прайс|прейскурант)', 'перечень\s+цен\s+по\s+прейскурант']
condition = "перечень нужен, если в смете есть ресурсы по прайс-листам"

[[item]]
id = "local-content"
title = "Сводная ведомость потребности основных материалов и оборудования с учётом казахстанского содержания"
basis = { new = "прил. 2, п. 5, подп. 8)", reconstruction = "прил. 3, п. 3, подп. 8)", capital_repair = "прил. 4, п. 3, подп. 8)" }
names = ['казахстанск\w*\s+содерж', 'каз\.?\s*содерж', 'казсодерж', 'сводн\w*\s+ведомост\w*\s+потребност']
heads = ['сводн\w*\s+ведомост\w*\s+потребност', 'казахстанск\w*\s+содержани']
